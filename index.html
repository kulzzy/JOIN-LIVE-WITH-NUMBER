<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kulzzy Radio - Live Community</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden}
body{background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#kulzzyLiveCommunity{width:100%;max-width:100%;margin:0;padding:0;overflow:visible;background:transparent}
#kulzzyLiveCommunity *,#kulzzyLiveCommunity *::before,#kulzzyLiveCommunity *::after{box-sizing:border-box}
.kulzzy-container{width:100%;max-width:100%;margin:0;padding:0}
.kulzzy-community-box{width:100%;margin:0;padding:0;background:transparent;border-radius:0;box-shadow:none}
.kulzzy-conversation-title{width:100%;text-align:center;margin:0;padding:4px 5px 10px;font-size:clamp(27px,7vw,58px);line-height:1.02;font-weight:1000;letter-spacing:1px;color:rgba(255,255,255,.18);text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.kulzzy-call-pictures{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 15px}
.kulzzy-call-picture{position:relative;width:100%;height:150px;overflow:hidden;border-radius:14px;border:1px solid rgba(255,208,0,.35);background:#001d40}
.kulzzy-call-picture img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;transition:transform .4s ease}
.kulzzy-call-picture:hover img{transform:scale(1.05)}
.kulzzy-call-picture-overlay{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;font-weight:900;text-align:center}

/* REAL PHONE + LADY BACKGROUND */
.kulzzy-phone-stage{position:relative;width:100%;max-width:920px;margin:0 auto;overflow:visible;line-height:0}
.kulzzy-phone-background{display:block;width:100%;height:auto;margin:0 auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.kulzzy-phone-screen-content{position:absolute;left:13.8%;top:8.6%;width:36.8%;height:67.8%;transform:rotate(4deg);transform-origin:center;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:4.5% 5%;overflow:hidden;border-radius:7% 7% 8% 8%;background:linear-gradient(180deg,rgba(0,24,55,.96),rgba(0,29,64,.94));box-shadow:inset 0 0 30px rgba(0,0,0,.35);line-height:normal;z-index:3}
.kulzzy-screen-brand{color:#ffd000;text-align:center;font-weight:1000;font-size:clamp(10px,1.45vw,19px);letter-spacing:1px;line-height:1.05;margin:0 0 5%}
.kulzzy-screen-brand small{display:block;color:#fff;font-size:.52em;letter-spacing:.6px;margin-top:2px}
#joinArea{width:100%;margin:0;padding:0}
.kulzzy-label{display:block;width:100%;font-weight:bold;font-size:clamp(10px,1.25vw,16px);margin:0 0 6px;color:#fff}
.kulzzy-input-row{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:7px}
#kulzzyLiveCommunity .kulzzy-phone{width:100%;height:clamp(34px,4.3vw,52px);padding:7px 9px;border-radius:9px;border:1px solid #46688f;background:#001d40;color:#fff;font-size:clamp(10px,1.35vw,17px);outline:none}
#kulzzyLiveCommunity .kulzzy-phone:focus{border-color:#ffd000}
.kulzzy-join-button{width:100%;height:clamp(36px,4.4vw,52px);margin:0;padding:0 7px;border:0;border-radius:9px;background:#ffd000;color:#001a3a;font-size:clamp(9px,1.25vw,16px);font-weight:900;cursor:pointer;white-space:nowrap}
.kulzzy-join-button:disabled{opacity:.6;cursor:not-allowed}
.kulzzy-error{min-height:18px;color:#ff8d8d;margin-top:5px;text-align:center;font-size:clamp(8px,1.05vw,14px);line-height:1.25}
.kulzzy-status-box{width:100%;margin-top:8px;background:#001d40;border:1px solid #46688f;border-radius:10px;padding:9px 7px;text-align:center;overflow:auto;max-height:49%;line-height:normal}
.kulzzy-status-icon{font-size:clamp(22px,3vw,45px);margin-bottom:3px}
.kulzzy-status-title{font-size:clamp(12px,1.65vw,23px);font-weight:bold;margin-bottom:4px}
.kulzzy-status-text{color:#c7d5e8;font-size:clamp(9px,1.15vw,16px);line-height:1.3}
.kulzzy-mic-controls{width:100%;margin-top:7px;text-align:center}
.kulzzy-mic-button{width:100%;height:clamp(34px,4.3vw,52px);padding:0 7px;border:0;border-radius:9px;background:#ffd000;color:#001a3a;font-size:clamp(9px,1.25vw,17px);font-weight:900;cursor:pointer;box-shadow:none}
.kulzzy-mic-button:active{transform:scale(.98)}
.kulzzy-mic-button.muted{background:#d40000;color:#fff}
.kulzzy-mic-button:disabled{opacity:.55;cursor:not-allowed}
.kulzzy-mic-status{margin-top:5px;color:#c7d5e8;font-size:clamp(8px,1vw,14px);line-height:1.3}
.kulzzy-hidden{display:none!important}

@media(max-width:600px){
  .kulzzy-conversation-title{font-size:29px;padding:3px 4px 9px}
  .kulzzy-call-pictures{grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}
  .kulzzy-call-picture{height:105px;border-radius:10px}
  .kulzzy-call-picture-overlay{font-size:9px;padding:16px 3px 5px}
  .kulzzy-phone-stage{width:100%;margin-top:0}
  .kulzzy-phone-screen-content{left:13.5%;top:8.4%;width:37.2%;height:67.9%;padding:4.5% 5%;border-radius:7%}
  .kulzzy-screen-brand{font-size:clamp(8px,2.3vw,15px);margin-bottom:4%}
  .kulzzy-label{font-size:clamp(8px,2.1vw,15px);margin-bottom:4px}
  .kulzzy-input-row{gap:5px}
  #kulzzyLiveCommunity .kulzzy-phone{height:clamp(29px,6.5vw,48px);padding:6px 7px;font-size:clamp(8px,2vw,15px)}
  .kulzzy-join-button{height:clamp(30px,6.5vw,48px);padding:0 5px;font-size:clamp(7px,1.9vw,14px)}
  .kulzzy-status-box{margin-top:5px;padding:6px 5px;max-height:51%}
  .kulzzy-status-icon{font-size:clamp(17px,5vw,32px)}
  .kulzzy-status-title{font-size:clamp(9px,2.5vw,18px)}
  .kulzzy-status-text{font-size:clamp(7px,1.8vw,12px)}
  .kulzzy-mic-button{height:clamp(28px,6vw,42px);font-size:clamp(7px,1.8vw,13px)}
}
@media(max-width:380px){
  .kulzzy-conversation-title{font-size:25px}
  .kulzzy-call-picture{height:88px}
  .kulzzy-call-picture-overlay{display:none}
  .kulzzy-phone-screen-content{left:13.2%;top:8.2%;width:37.5%;height:68%}
}
</style>
</head>
<body>
<div id="kulzzyLiveCommunity">
  <div class="kulzzy-container">
    <main class="kulzzy-community-box">
      <div class="kulzzy-conversation-title">
        JOIN THE CONVERSATION<br>
        LET'S CELEBRATE
      </div>

      <div class="kulzzy-call-pictures">
        <div class="kulzzy-call-picture">
          <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/The_phone_call.jpg" alt="Nigerian person using a smartphone" loading="lazy">
          <div class="kulzzy-call-picture-overlay">📱 STAY CONNECTED</div>
        </div>
        <div class="kulzzy-call-picture">
          <img src="https://www.cph.cam.ac.uk/sites/default/files/adobestock_479668969.jpeg" alt="African woman receiving a phone call" loading="lazy">
          <div class="kulzzy-call-picture-overlay">📞 RECEIVE THE CALL</div>
        </div>
        <div class="kulzzy-call-picture">
          <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Participant_on_Mobile_Phone_WikiDemocracy_Event_May_2017_30.jpg" alt="Nigerian person using a mobile phone" loading="lazy">
          <div class="kulzzy-call-picture-overlay">🎙️ JOIN THE COMMUNITY</div>
        </div>
      </div>

      <!-- YOUR UPLOADED LADY + PHONE IS THE BACKGROUND HERE -->
      <div class="kulzzy-phone-stage">
        <img class="kulzzy-phone-background" src="kulzzy_iphone_lady_clean.png" alt="Woman holding a large phone">

        <!-- THE ACTUAL WORKING CONTROLS SIT ON THE PHONE SCREEN -->
        <div class="kulzzy-phone-screen-content">
          <div class="kulzzy-screen-brand">
            KULZZY RADIO
            <small>LIVE COMMUNITY</small>
          </div>

          <div id="joinArea">
            <label class="kulzzy-label" for="phoneNumber">Your Phone Number</label>
            <div class="kulzzy-input-row">
              <input class="kulzzy-phone" type="tel" id="phoneNumber" placeholder="+2349017759411" autocomplete="tel" inputmode="tel">
              <button type="button" class="kulzzy-join-button" id="joinButton">🎙️ JOIN US LIVE ON-AIR</button>
            </div>
            <div class="kulzzy-error" id="errorMessage"></div>
          </div>

          <div class="kulzzy-status-box kulzzy-hidden" id="statusBox">
            <div class="kulzzy-status-icon" id="statusIcon">⏳</div>
            <div class="kulzzy-status-title" id="statusTitle">You're in the queue</div>
            <div class="kulzzy-status-text" id="statusText">You are connected. Please wait for the host to allow you to speak.</div>
            <div class="kulzzy-mic-controls kulzzy-hidden" id="micControls">
              <button type="button" class="kulzzy-mic-button" id="micButton">🎙️ START TALKING</button>
              <div class="kulzzy-mic-status" id="micStatus">Tap the button to start talking on-air.</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script type="module">
/*
=========================================================
KULZZY RADIO NETWORK
LIVE COMMUNITY
GITHUB VERSION

DO NOT CHANGE:

firebase.js
webrtc.js
=========================================================
*/
import { auth, db } from "./js/firebase.js";
import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { ref, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import { connectCaller, muteLocalMicrophone, closeWebRTC } from "./js/webrtc.js";

const phoneInput = document.getElementById("phoneNumber");
const joinButton = document.getElementById("joinButton");
const joinArea = document.getElementById("joinArea");
const statusBox = document.getElementById("statusBox");
const statusIcon = document.getElementById("statusIcon");
const statusTitle = document.getElementById("statusTitle");
const statusText = document.getElementById("statusText");
const errorMessage = document.getElementById("errorMessage");
const micControls = document.getElementById("micControls");
const micButton = document.getElementById("micButton");
const micStatus = document.getElementById("micStatus");

let currentUser = null;
let callerUid = null;
let callerRef = null;
let callerUnsubscribe = null;
let callerListenerStarted = false;
let currentPhone = null;
let microphoneMuted = true;
let webRTCConnected = false;
let firebaseReady = false;

let resolveFirebaseReady;
const firebaseReadyPromise = new Promise((resolve) => { resolveFirebaseReady = resolve; });

function showError(message){ if(errorMessage){ errorMessage.textContent = message; } }
function clearError(){ if(errorMessage){ errorMessage.textContent = ""; } }

function normalizePhone(phone){
  let value = String(phone || "").trim().replace(/[^\d+]/g, "");
  if(value.startsWith("0") && value.length >= 10){ value = "+234" + value.substring(1); }
  if(value.startsWith("234") && !value.startsWith("+234")){ value = "+" + value; }
  return value;
}

function createCallerId(phone){
  const normalized = normalizePhone(phone);
  const digits = normalized.replace(/\D/g, "");
  return "caller_" + digits;
}

function showStatus(icon,title,text){
  statusIcon.textContent = icon;
  statusTitle.textContent = title;
  statusText.textContent = text;
  statusBox.classList.remove("kulzzy-hidden");
}

function showMicControls(){
  micControls.classList.remove("kulzzy-hidden");
  microphoneMuted = true;
  updateMicButton();
}
function hideMicControls(){ micControls.classList.add("kulzzy-hidden"); }

function updateMicButton(){
  if(!micButton){ return; }
  if(microphoneMuted){
    micButton.classList.remove("muted");
    micButton.textContent = "🎙️ START TALKING";
    micStatus.textContent = "Tap the button to start talking on-air.";
  }else{
    micButton.classList.add("muted");
    micButton.textContent = "🔇 MUTE MICROPHONE";
    micStatus.textContent = "Your microphone is ON. You are talking on-air.";
  }
}

function updateCallerStatus(caller){
  if(!caller){ return; }
  if(caller.status === "disconnected" || caller.online === false){
    showStatus("❌","Disconnected","The host has disconnected you. You can join again when invited.");
    hideMicControls();
    return;
  }
  if(caller.allowedToSpeak === true){
    showStatus("🎙️","YOU ARE LIVE!","The host has allowed you to speak. Tap the microphone button below to start talking on-air.");
    showMicControls();
    return;
  }
  showStatus("⏳","You're in the queue","You are connected. Please wait for the host to allow you to speak.");
  hideMicControls();
}

function stopCallerListener(){
  if(callerUnsubscribe){
    try{ callerUnsubscribe(); }catch(error){ console.error("Listener stop error:",error); }
  }
  callerUnsubscribe = null;
  callerListenerStarted = false;
}

function startCallerListener(){
  if(callerListenerStarted || !callerRef){ return; }
  callerListenerStarted = true;
  callerUnsubscribe = onValue(callerRef,(snapshot)=>{
    const caller = snapshot.val();
    if(caller){ updateCallerStatus(caller); }
  },(error)=>{
    console.error("Firebase caller listener error:",error);
    callerListenerStarted = false;
  });
}

async function markCurrentCallerOffline(){
  if(!callerRef){ return; }
  try{
    await update(callerRef,{online:false,status:"offline",muted:true,allowedToSpeak:false,lastSeen:Date.now()});
  }catch(error){ console.error("Offline update error:",error); }
}

async function registerCaller(){
  clearError();
  if(!currentUser){
    showError("Connecting to the live system...");
    try{
      await Promise.race([
        firebaseReadyPromise,
        new Promise((_,reject)=>{ setTimeout(()=>reject(new Error("Firebase authentication timeout")),10000); })
      ]);
    }catch(error){
      console.error("Firebase ready error:",error);
      showError("Unable to connect to the live system. Please refresh the page and try again.");
      return;
    }
  }
  if(!currentUser){
    showError("Unable to connect to the live system. Please refresh the page and try again.");
    return;
  }
  const phone = normalizePhone(phoneInput.value);
  if(!phone){ showError("Please enter your phone number."); return; }
  if(phone.length < 10){ showError("Please enter a valid phone number."); return; }
  const newCallerUid = createCallerId(phone);
  if(callerRef && callerUid && callerUid !== newCallerUid){
    await markCurrentCallerOffline();
    stopCallerListener();
  }
  callerUid = newCallerUid;
  currentPhone = phone;
  callerRef = ref(db,"callers/" + callerUid);
  joinButton.disabled = true;
  joinButton.textContent = "CONNECTING...";
  try{
    const now = Date.now();
    await update(callerRef,{phone:phone,status:"waiting",muted:true,allowedToSpeak:false,online:true,lastSeen:now,joinedAt:now});
    const disconnect = onDisconnect(callerRef);
    await disconnect.update({online:false,status:"offline",muted:true,allowedToSpeak:false,lastSeen:Date.now()});
    try{
      localStorage.setItem("kulzzy_live_phone",phone);
      localStorage.setItem("kulzzy_live_caller_uid",callerUid);
    }catch(storageError){ console.log("Local storage unavailable:",storageError); }
    phoneInput.value = phone;
    joinArea.classList.add("kulzzy-hidden");
    showStatus("⏳","You're in the queue","You are connected. Please wait for the host to allow you to speak.");
    hideMicControls();
    startCallerListener();
    console.log("====================================");
    console.log("KULZZY CALLER REGISTERED");
    console.log("Phone:",phone);
    console.log("Caller ID:",callerUid);
    console.log("Firebase path:","callers/" + callerUid);
    console.log("====================================");
  }catch(error){
    console.error("CALLER REGISTRATION ERROR:",error);
    joinButton.disabled = false;
    joinButton.textContent = "🎙️ JOIN US LIVE ON-AIR";
    let message = "Unable to connect to the live system. Please try again.";
    if(error && (error.code === "PERMISSION_DENIED" || String(error.message || "").toLowerCase().includes("permission"))){
      message = "Firebase permission denied. Please check your Firebase Realtime Database rules.";
    }
    showError(message);
  }
}

async function toggleMicrophone(){
  clearError();
  if(!callerUid){ showError("Please join the live community first."); return; }
  try{
    if(!webRTCConnected){
      micButton.disabled = true;
      micButton.textContent = "🎙️ CONNECTING...";
      micStatus.textContent = "Connecting your microphone to the host...";
      await connectCaller(callerUid);
      webRTCConnected = true;
      microphoneMuted = false;
      updateMicButton();
      await update(callerRef,{muted:false,allowedToSpeak:true,status:"speaking",online:true});
      console.log("Caller WebRTC connected.");
      return;
    }
    microphoneMuted = !microphoneMuted;
    muteLocalMicrophone(microphoneMuted);
    await update(callerRef,{muted:microphoneMuted,allowedToSpeak:!microphoneMuted,status:microphoneMuted ? "muted" : "speaking"});
    updateMicButton();
  }catch(error){
    console.error("MICROPHONE / WEBRTC ERROR:",error);
    webRTCConnected = false;
    microphoneMuted = true;
    micButton.disabled = false;
    updateMicButton();
    if(error && error.name === "NotAllowedError"){
      showError("Microphone permission was denied. Please allow microphone access and try again.");
    }else if(error && error.name === "NotFoundError"){
      showError("No microphone was found on this device.");
    }else{
      showError("Unable to connect your microphone. Please try again.");
    }
    micStatus.textContent = "Microphone connection failed. Please try again.";
  }finally{
    micButton.disabled = false;
  }
}

joinButton.addEventListener("click",function(){ registerCaller(); });
phoneInput.addEventListener("keydown",function(event){ if(event.key === "Enter"){ event.preventDefault(); registerCaller(); } });
micButton.addEventListener("click",function(){ toggleMicrophone(); });

onAuthStateChanged(auth,async function(user){
  if(user){
    currentUser = user;
    firebaseReady = true;
    console.log("Firebase authentication ready:",user.uid);
    resolveFirebaseReady();
    try{
      const savedPhone = localStorage.getItem("kulzzy_live_phone");
      if(savedPhone && !currentPhone){ phoneInput.value = savedPhone; }
    }catch(error){ console.log("Unable to load saved phone:",error); }
    console.log("Kulzzy Live Community is ready.");
    return;
  }
  currentUser = null;
  firebaseReady = false;
  console.log("No Firebase anonymous user.");
  try{
    await signInAnonymously(auth);
    console.log("Firebase anonymous authentication started.");
  }catch(error){
    console.error("Firebase anonymous authentication error:",error);
    showError("Unable to connect to the live system. Please refresh the page and try again.");
  }
});

window.addEventListener("beforeunload",function(){
  try{
    if(callerRef){
      update(callerRef,{online:false,status:"offline",muted:true,allowedToSpeak:false,lastSeen:Date.now()});
    }
    if(webRTCConnected){ closeWebRTC(callerUid); }
  }catch(error){ console.log("Cleanup error:",error); }
});

console.log("====================================");
console.log("KULZZY RADIO NETWORK");
console.log("LIVE COMMUNITY");
console.log("GITHUB VERSION");
console.log("Firebase + WebRTC enabled");
console.log("====================================");
</script>
</body>
</html>
